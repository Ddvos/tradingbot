# Pre-commit hooks for tradingbot.
# Install once: `uv run pre-commit install` (or `pre-commit install` if installed globally)
# Run manually on all files: `uv run pre-commit run --all-files`

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  # ruff and basedpyright run in the project's own uv env so pre-commit,
  # `uv run ruff`, and CI all use the exact version pinned in uv.lock — a
  # separate pre-commit env would drift (and basedpyright would miss the
  # installed libraries and their type stubs).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint + autofix)
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/.*\.py$
      - id: basedpyright
        name: basedpyright (strict type check)
        entry: uv run --directory backend basedpyright
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: false
