# Local development Postgres for the tradingbot backend.
# Start:  docker compose up -d
# Stop:   docker compose down        (data survives in the named volume)
# Wipe:   docker compose down -v

services:
  postgres:
    image: postgres:17
    container_name: tradingbot-postgres
    environment:
      POSTGRES_USER: tradingbot
      POSTGRES_PASSWORD: tradingbot
      POSTGRES_DB: tradingbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
