[project]
name = "tradingbot"
version = "0.1.0"
description = "Finds Bitcoin's turning points on a chart; later trades them on Kraken."
authors = [{ name = "Ddvos" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.147.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
